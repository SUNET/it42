# Topology, users and permissions come from definitions.json, generated by
# scripts/gen-rabbit-defs.py. The guest user is never created.
load_definitions = /etc/rabbitmq/definitions.json
loopback_users.guest = true
# AMQP only on the mq_* networks (static addresses in compose.yaml). The edge
# network, shared with the web containers, reaches only the management UI.
listeners.tcp.1 = 10.242.1.10:5672
listeners.tcp.2 = 10.242.2.10:5672
listeners.tcp.3 = 10.242.3.10:5672
listeners.tcp.4 = 10.242.4.10:5672
listeners.tcp.5 = 10.242.5.10:5672
listeners.tcp.6 = 10.242.6.10:5672
listeners.tcp.7 = 10.242.7.10:5672
management.tcp.port = 15672
log.console = true
log.console.level = info
